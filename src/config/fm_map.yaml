# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket/injected text overrides DB delay_days        (variant: ticket_trust)
stale_policy: FM-06            # superseded / not-yet-effective clause used          (variant: stale_clause)
clause_sum: FM-04              # clauses summed instead of taking the max            (variant: sum_parts)
double_deduct: FM-05           # prior refund deducted by the agent AND by the host  (variant: pre_deducted)
sibling_refund: FM-07          # refund written under a sibling claim of the order   (variant: sibling_refund)
denied_ignored: FM-02          # host policy_denied overruled, agent says resolved   (variant: ignore_denied)
reply_ledger_mismatch: FM-08   # reply amount != amount the ledger holds             (variant: misreport)
cross_principal: FM-09         # another principal's order / PII                     (no public variant)
